aid: accurateinternational
name: Accurate International
description: >-
  Accurate International Biotechnology (trading as ACCURATE, 广州创芯国际生物科技有限公司) is a
  Guangzhou, China biotechnology company founded in 2018 that builds the full industry chain
  around organoid technology for cancer precision medicine, new drug research and regenerative
  medicine. Its products are wet-lab reagents, instruments and consumables rather than software:
  Accuroid organoid culture media, the AccuArray microarray organoid chip, the AOMF microfluidic
  organoid chip and 3D bioprinter, the AccuLumi high-throughput chemiluminescence detector, and
  Accuauto automated organoid culture workstations. On top of those it sells services — BUDcare
  and BUDhealth patient-derived tumor organoid drug-sensitivity testing delivered through
  Guangzhou Chuangxin Independent Clinical Laboratory, and organoid-model new-drug R&D services
  for pharma — and reports 32,000+ organoid cultures, 5,000+ tumor organoid models, 200+ clinical
  collaborators and 100+ filed patents. It holds subsidiaries in Beijing, Shanghai and Macau plus
  a European entity, and has raised Pre-A (2020), Series A (2021), a 100M RMB Pre-B (2022) and a
  Series B (2024). ACCURATE describes internal digital assets — the AOD Tronchip organoid
  database launched in 2023 and a cancer "deep-thinking" AI model built in 2024 — but publishes
  no developer portal, API reference, SDK, CLI, status page or public GitHub organization, and no
  OpenAPI, AsyncAPI, GraphQL, MCP or A2A agent-card surface was found on any host it operates.
